agent:
  name: spacemouse
  robot: ur5
  verbose: true
  spacemouse:
    device_path:
    translation_scale: 0.03
    angle_scale: 0.09
    invert_control: [1, 1, 1, 1, 1, 1]
    rotation_mode: euler
    invert_button: false
    gripper_open: 1000
    gripper_closed: 0


camera:
  hostname: "127.0.0.1"
  fps: 30
  enable_depth: true
  # High Density reduces holes. To diagnose two-camera IR interference, test
  # emitter_enabled: false on one camera at a time instead of enabling both here.
  depth_options:
    wrist:
      visual_preset: high_density
    third_left_top:
      visual_preset: high_density
  calibration_dir: "configs/cameras"
  realsense_ids:
    "353522301461": third_left_top
    "333422304095": wrist
  intrinsics_files:
    third_left_top: "configs/cameras/intrinsics_third_left_top.yaml"
    wrist: "configs/cameras/intrinsics_wrist.yaml"
  extrinsics_file: "configs/cameras/extrinsics.yaml"

gripper:
  type: dh_pgc_140_50
  port: "/dev/ttyUSB0"
  position_tolerance: 10
  min_command_interval_s: 0.05
  position_read_interval_s: 0.1

dataset:
  lerobot:
    repo_id: "pick_place_pens_blocks_200_train_v3.0"
    root: ".datasets/lerobot/pick_place_pens_blocks_200_train_v3.0"
    fps: 15
    async_recording: true
    record_queue_size: 64
    # HEVC episode concatenation can shift PTS by a few time-base ticks.
    # Rebuild the depth-video episode boundaries from actual frame PTS at finalize.
    repair_video_timestamps: true
    # Preserve the RealSense invalid-depth sentinel: raw 0 mm decodes back to 0,
    # rather than being clipped to the old 10 mm default.
    depth_min_m: 0.0

safety:
  joint_limits_file: "configs/safety/ur5e_joint_limits.yaml"

vla:
  server_url: "ws://127.0.0.1:8000"
  api_key:
  repo_id: "pick_place_blocks_150_train1_v3.0"
  state_key: "observation.state"
  image_key_map:
    third_left_top_rgb: "observation.images.third_person"
    wrist_rgb: "observation.images.wrist"
  action_space: "abs"
  execute_horizon: 15
  request_timeout_s: 5.0
  # max_joint_delta: 0.1
  reset_on_start: true
  threshold: 0.7 ##0.7for block
  # ws-control 协议：json（默认）、fastwam（msgpack，无握手）或 openpi05
  model: "json"
  # 请求体里的 state / 图片字段固定在 src/apps/run_ws_control.py 的
  # IMAGE_FIELDS / FASTWAM_IMAGE_FIELDS / OPENPI_IMAGE_FIELDS 常量里。
  # fastwam / openpi05 示例：
  # model: "fastwam"
  # model: "openpi05"
rtc:
  enabled: true
  config:
    ACTION_CHUNK: 15
    REPLAN_STEPS: 10
    RTC_EXECUTION_HORIZON: 5
    RTC_MAX_GUIDANCE_WEIGHT: 10.0
    RTC_PREFIX_ATTENTION_SCHEDULE: "EXP"


task:
  file: "configs/tasks/pick_place_pen_block.yaml"
  episode_count: 20
