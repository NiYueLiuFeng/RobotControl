agent:
  name: spacemouse
  robot: ur5
  verbose: true
  spacemouse:
    device_path:
    translation_scale: 0.03
    angle_scale: 0.09
    invert_control: [1, 1, 1, 1, 1, 1]
    rotation_mode: euler
    invert_button: false
    gripper_open: 1000
    gripper_closed: 0


camera:
  hostname: "127.0.0.1"
  fps: 30
  enable_depth: false
  calibration_dir: "configs/cameras"
  realsense_ids:
    # "333422300669": third_front
    "353522301461": third_left_top
    "333422304095": wrist
  intrinsics_files:
    # third_front: "configs/cameras/intrinsics_third_front.yaml"
    third_left_top: "configs/cameras/intrinsics_third_left_top.yaml"
    wrist: "configs/cameras/intrinsics_wrist.yaml"
  extrinsics_file: "configs/cameras/extrinsics.yaml"

gripper:
  type: dh_pgc_140_50
  port: "/dev/ttyUSB0"
  position_tolerance: 10
  min_command_interval_s: 0.05
  position_read_interval_s: 0.1

dataset:
  lerobot:
    repo_id: "pick_place_cable_white_box_50_train_v3.0"
    # repo_id: "pick_place_cable_black_box_50_train_v3.0"
    # repo_id: "pick_place_one_pen_train_50_v3.0"
    root: ".datasets/lerobot/pick_place_one_pen_train_50_v3.0"
    fps: 15
    async_recording: true
    record_queue_size: 64

safety:
  joint_limits_file: "configs/safety/ur5e_joint_limits.yaml"

vla:
  server_url: "ws://127.0.0.1:8000"
  api_key:
  repo_id: "pick_place_cable_brown_box_200_train_v3.0"
  # repo_id: "pick_place_cable_black_box_50_train_v3.0"
  # repo_id: "pick_place_white_pen_train_50_v3.0"
  state_key: "observation.state"
  image_key_map:
    # third_front_rgb: "observation.images.third_person"
    third_left_top_rgb: "observation.images.third_person"
    wrist_rgb: "observation.images.wrist"
  action_space: "abs"
  execute_horizon: 15
  request_timeout_s: 5.0
  # max_joint_delta: 0.1
  reset_on_start: true
  threshold: 0.7 ##0.7for block


task:
  file: "configs/tasks/pick_place_cable_brown_box.yaml"
  # file: "configs/tasks/pick_place_cable_white_box.yaml"
  # file: "configs/tasks/pick_place_cable_black_box.yaml"
  # file: "configs/tasks/pick_place_red_pen.yaml"
  # file: "configs/tasks/pick_place_one_pen.yaml"
  # file: "configs/tasks/pick_place_black_pen.yaml"
  # file: "configs/tasks/pick_place_white_pen.yaml"
  # file: "configs/tasks/pick_place_pink_block.yaml"
  episode_count: 50
