robot:
  name: ur5e
  ip: "192.168.56.2"
  zmq_host: "127.0.0.1"
  zmq_port: 6001
  control_hz: 100
  reset_joints: [1.56, -1.57, 1.58, -1.58, -1.57, -0.0077, 1000.0]

